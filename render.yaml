# Render blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: code-arena
    runtime: docker
    plan: free                  # 512 MB RAM, sleeps after 15 min idle
    region: singapore           # change to your nearest region
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Set these via the Render dashboard after first deploy:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false             # https://code-arena.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false             # https://code-arena.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
# NOTE: the bot trainer runs IN-PROCESS inside the web service (server.ts).
# Render free tier doesn't include background workers, so we co-locate.
# Toggle bots into the trainer at /admin/training. To disable globally set
# DISABLE_TRAINER=1 on the web service.
