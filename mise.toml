[tools]
# Pin Bun. Major.minor pin keeps everyone on the same line; mise resolves
# to the latest patch within 1.3.x. Don't use "latest" — it drifts under you.
bun = "1.3"

[env]
# Auto-load .env (repo root) when you cd into the repo. The file is gitignored
# and holds DATABASE_URL, AUTH_SECRET, GOOGLE_CLIENT_*, etc.
_.file = ".env"
